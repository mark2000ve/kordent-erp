[workspace]
resolver = "3"
members = [
    "apps/kordent-api",
    "apps/kordent-worker",
    "apps/kordent-cli",
    "crates/kordent-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
kordent-core = { path = "crates/kordent-core" }
uuid = { version = "1.24.0", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
